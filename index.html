<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MemtoFit</title>
<meta name="description" content="Your questionnaire and your program.">
<link rel="canonical" href="https://memtofit.memtoria.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MemtoFit">
<meta property="og:url" content="https://memtofit.memtoria.com/">
<meta property="og:title" content="MemtoFit">
<meta property="og:description" content="Your questionnaire and your program.">
<meta property="og:image" content="https://memtofit.memtoria.com/og-image.jpg?v=2">
<meta property="og:image:secure_url" content="https://memtofit.memtoria.com/og-image.jpg?v=2">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="MemtoFit">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="MemtoFit">
<meta name="twitter:description" content="Your questionnaire and your program.">
<meta name="twitter:image" content="https://memtofit.memtoria.com/og-image.jpg?v=2">
<style>
  :root {
    --raft-bg: #2C4A27;
    --raft-bg-inv: #181F17;
    --raft-accent: #FAAF58;
    --raft-fg: #F2F2F2;
    --paper: #f7f4ee;
    --ink: #181F17;
    --muted: #4a5a48;
    --tap: 2.75rem;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .hero {
    background: var(--raft-bg);
    color: var(--raft-fg);
    padding: 1.35rem 1.1rem 1.5rem;
    text-align: center;
  }
  .brand {
    margin: 0 auto;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--raft-accent);
    line-height: 1.2;
  }
  .hero h1 {
    margin: 0.7rem 0 0.35rem;
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.25;
    color: var(--raft-fg);
  }
  .hero .sub {
    margin: 0 auto;
    max-width: 28rem;
    color: var(--raft-fg);
    opacity: 0.88;
    font-size: 0.95rem;
  }
  .wrap { max-width: 40rem; margin: 0 auto; padding: 1.25rem 0.9rem 3rem; }
  .choice {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: var(--tap);
    margin: 0 0 0.7rem;
    border: 0;
    border-radius: 0.7rem;
    background: var(--raft-bg);
    color: var(--raft-fg);
    font: 600 1rem/1 system-ui, sans-serif;
    text-decoration: none;
    text-align: center;
  }
  .choice.alt { background: var(--raft-accent); color: var(--raft-bg-inv); }
  .choice.is-disabled { opacity: 0.45; pointer-events: none; }
  .hint {
    margin: -0.2rem 0 0;
    text-align: center;
    color: var(--muted);
    font-size: 0.92rem;
  }
</style>
</head>
<body>
<header class="hero">
  <p class="brand">MemtoFit</p>
  <h1>Your program</h1>
  <p class="sub" id="need-link" hidden>Open the link you were sent.</p>
</header>
<main class="wrap">
  <div id="choices" hidden>
    <a class="choice" id="questionnaire-link" href="questionnaire.html">Questionnaire</a>
    <a class="choice alt is-disabled" id="program-link" href="program.html" aria-disabled="true">Program</a>
    <p class="hint" id="program-note">Available next month</p>
  </div>
</main>
<script src="config.js?v=3"></script>
<script src="gate.js?v=3"></script>
<script src="slot.js?v=3"></script>
<script>
memtofitGate.start().then(function (session) {
  var need = document.getElementById("need-link");
  var choices = document.getElementById("choices");
  if (!session) {
    need.hidden = false;
    return;
  }
  choices.hidden = false;
  var questionnaire = document.getElementById("questionnaire-link");
  var program = document.getElementById("program-link");
  questionnaire.href = "questionnaire.html?s=" + session.id;
  program.href = "program.html?s=" + session.id;
  var pending = session.row ? Promise.resolve(session.row) : memtofitSlot.load(session);
  return pending.then(function (row) {
    if (row && row.plan) {
      program.classList.remove("is-disabled");
      program.removeAttribute("aria-disabled");
      document.getElementById("program-note").hidden = true;
    }
  }).catch(function () {});
});
</script>
</body>
</html>
