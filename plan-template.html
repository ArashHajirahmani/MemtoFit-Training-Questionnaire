<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C4A27">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<style>
:root{--green:#2C4A27;--deep:#181F17;--amber:#FAAF58;--orange:#F99E34;--paper:#F7F6F1;--ink:#20251E;--muted:#667061;--line:#E5E7DF;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{background:var(--paper);-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.hero{padding:calc(22px + env(safe-area-inset-top,0px)) 20px 23px;background:var(--green);color:#F2F2F2}.inner,.nav,.main{max-width:650px;margin-inline:auto}.brand{margin:4px 0 0;color:var(--amber);font-size:13px;font-weight:600;letter-spacing:0}h1{margin:0;font-size:clamp(30px,8vw,40px);line-height:1.05;letter-spacing:-.04em}.period{margin:8px 0 0;color:#f2f2f2d0;font-size:14px}.goal{display:inline-block;margin:15px 0 0;padding:6px 10px;border:1px solid #FAAF5870;border-radius:99px;color:var(--amber);font-size:12px;font-weight:700}.sticky{position:sticky;top:0;z-index:4;padding:10px max(12px,calc((100vw - 650px)/2));border-bottom:1px solid var(--line);background:#F7F6F1EE;backdrop-filter:blur(12px)}.nav{display:flex;gap:7px}.weeks{padding:4px;border-radius:13px;background:#E9ECE5}.nav button{flex:1;min-width:0;min-height:44px;padding:0 7px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font:inherit;font-weight:750;cursor:pointer;touch-action:manipulation}.weeks button{border:0;background:transparent}.weeks [aria-selected="true"]{background:var(--green);color:#fff}.days{margin-top:8px}.days button{font-size:13px}.days [aria-selected="true"]{border-color:var(--orange);background:#FFF4E6;color:var(--deep)}.days small{display:block;font-size:10px;line-height:1.1;opacity:.72}.main{padding:18px 14px calc(34px + var(--safe))}.panel[hidden],[role="tabpanel"][hidden]{display:none}.eyebrow{margin:0 2px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.09em}.panel h2{margin:2px;font-size:26px;letter-spacing:-.03em}.focus{margin:4px 2px 12px;color:var(--muted);font-size:12px}.table-wrap{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 4px 18px #22301C0B}.table-wrap table{width:100%;border-collapse:collapse;text-align:left}.table-wrap thead{background:#F1F3ED}.table-wrap thead th{padding:11px 14px;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.table-wrap thead th:last-child{text-align:right}.table-wrap tbody th,.table-wrap tbody td{padding:14px;border-top:1px solid var(--line);vertical-align:middle}.table-wrap tbody th{font-size:15px;font-weight:750}.table-wrap tbody td{width:34%;color:var(--green);font-size:14px;font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.table-wrap tbody td.sets{white-space:normal}.table-wrap tbody tr:first-child th,.table-wrap tbody tr:first-child td{border-top:0}.exercise{display:flex;align-items:center;flex-wrap:wrap;gap:6px;line-height:1.4}.exercise:has(.join){flex-direction:column;align-items:flex-start;gap:4px}.exercise:has(.join)>.join{display:block}.set-stack{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px;min-width:0;max-width:100%}.set-line{display:block;max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.25}a{color:inherit;text-decoration-color:var(--orange);text-decoration-thickness:2px;text-underline-offset:3px}.join{font-weight:750}.hint{display:block;margin-top:5px;color:var(--muted);font-size:11px;font-weight:650}.prescription{display:grid;grid-template-columns:minmax(0,1fr) 30px;align-items:start;justify-items:end;column-gap:6px;row-gap:1px}.set-value{min-width:0;max-width:100%;text-align:right}.done-toggle{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:0 0 30px;cursor:pointer}.done-box{appearance:none;display:grid;place-items:center;width:22px;height:22px;margin:0;border:1.5px solid #91A58A;border-radius:6px;background:#fff;cursor:pointer}.done-box:checked{border-color:#9BBE91;background:#DDEDD7}.done-box:checked:after{content:"";width:6px;height:11px;margin-top:-3px;border:solid var(--green);border-width:0 2px 2px 0;transform:rotate(45deg)}.done-time{display:block;width:30px;margin:0;color:#547C4B;font-size:10px;font-weight:650;line-height:1;text-align:center;font-variant-numeric:tabular-nums}.done-time[hidden]{display:none}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}@media(max-width:420px){.sticky{padding-inline:9px}.main{padding:14px 10px calc(28px + var(--safe))}.days button{font-size:12px}.panel h2{font-size:24px}.table-wrap tbody th,.table-wrap tbody td{padding:13px 10px}.table-wrap tbody th{font-size:14px}.table-wrap tbody td{font-size:13px;width:auto}.prescription{column-gap:4px}.set-value{white-space:normal}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}@media print{.sticky{position:static}.panel[hidden]{display:block!important;break-before:page}.main{max-width:none}.table-wrap{break-inside:avoid}}
.weeks[hidden]{display:none}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.load{display:block;width:4.4rem;height:20px;min-height:0;margin:0;padding:0 3px;border:1px solid var(--orange);border-radius:6px;background:#fff;color:var(--ink);font:700 11px/18px system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
.load[hidden]{display:none}
.load::placeholder{color:#8A9484;font-weight:650}
h2.noted{display:flex;align-items:center;gap:8px}
.info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:0 0 18px;margin:0;padding:0;border:1.5px solid var(--orange);border-radius:50%;background:#fff;color:var(--deep);font:700 11px/1 Georgia,"Times New Roman",serif;cursor:pointer;vertical-align:middle}
h1 .info{margin-left:8px;position:relative;top:-6px}
.info.on-dark{border-color:var(--amber);background:transparent;color:var(--amber)}
.note-src{display:none}
.note-pop{position:fixed;z-index:30;max-width:min(24rem,calc(100vw - 20px));max-height:min(70vh,32rem);overflow:auto;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:14px;font-weight:500;line-height:1.45;box-shadow:0 10px 28px #22301C24}.note-pop h3{margin:14px 0 6px;font-size:13px}.note-pop h3:first-child{margin-top:0}.note-pop p{margin:0 0 8px}.note-pop table{width:100%;margin:0 0 10px;border-collapse:collapse;font-size:13px;font-weight:500}.note-pop th,.note-pop td{padding:6px 8px 6px 0;border-top:1px solid var(--line);text-align:left;vertical-align:top;color:var(--ink);font-size:13px;font-weight:500;width:auto;white-space:normal}.note-pop td{padding-left:8px}.note-pop thead th{border-top:0;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.note-pop tbody th{width:7.2rem;color:var(--green);font-weight:750}
.day-note-wrap{margin:14px 2px 0}
.day-note-wrap span{display:block;margin:0 0 4px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.day-note{width:100%;min-height:4.6rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:15px;font-weight:500;resize:vertical}
.progress{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin:10px 0 0}
.week-dots{display:flex;flex-wrap:wrap;gap:7px;margin:0;padding:0}
.week-dots[hidden]{display:none}
.week-dots span{width:9px;height:9px;flex:0 0 9px;box-sizing:border-box;border:1.5px solid var(--amber);border-radius:50%;background:transparent}
.week-dots span.on{background:var(--amber)}
.panel .table-wrap + .eyebrow{display:block;margin:16px 2px 8px}
.week-count{margin:0;color:#f2f2f2cc;font-size:12px;font-weight:650}
.week-count[hidden]{display:none}
@media(max-width:420px){.load{width:4rem}}
.site-foot{margin:0;padding:4px 14px calc(18px + var(--safe));text-align:center;color:var(--muted);font-size:12px;line-height:1.4}.site-foot p{margin:0}
.side{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:100%}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hero-copy{min-width:0;flex:1 1 auto}
.trainer{flex:0 1 auto;max-width:46%;margin:0;padding:0;text-align:center}
.trainer-card{display:flex;flex-direction:column;align-items:center;gap:2px}
.trainer-card[hidden]{display:none}
.trainer-photo{display:block;width:64px;height:64px;max-width:512px;max-height:512px;aspect-ratio:1;margin:0 0 4px;border-radius:12px;object-fit:cover;background:#F7F6F1}
.trainer-status{margin:0;max-width:11rem;color:#f2f2f2d0;font-size:11px;font-weight:650;line-height:1.25;text-align:center;text-wrap:balance}
.trainer-name{display:flex;align-items:center;justify-content:center;gap:6px;margin:0;color:#F2F2F2;font-size:14px;font-weight:750;line-height:1.2;text-align:center}
.trainer-who{min-width:0}
.trainer-role{display:flex;align-items:center;justify-content:center;gap:6px;margin:0;color:#f2f2f2cc;font-size:12px;font-weight:650;line-height:1.2;text-align:center}
.trainer-chat{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 22px;color:var(--amber);text-decoration:none}
.trainer-chat svg{display:block}
a.trainer-portfolio.info{text-decoration:none}
@media(max-width:420px){.trainer-name{font-size:13px}.trainer-role{font-size:11px}}
.day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 2px}
.day-head-main{min-width:0;flex:1 1 auto}
.day-head-main .eyebrow,.day-head-main h2{margin-left:0;margin-right:0}
.day-head-side{flex:0 0 auto;margin-left:auto}
.day-head-slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:5.5rem;text-align:center}
.active-on{display:flex;flex-direction:column;align-items:center;gap:2px}
.active-on[hidden],.switch-program[hidden],.activate-day[hidden]{display:none}
.active-on-label{display:block;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.active-on-date{display:block;color:var(--ink);font-size:13px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.2}
.active-on-clear{appearance:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:2px 0 0;padding:0;border:0;border-radius:6px;background:transparent;color:#b42318;font:700 18px/1 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
.active-on-clear:hover{background:#f8e4e2}
.switch-program,.activate-day{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:32px;margin:0;padding:6px 10px;border-radius:10px;font:750 12px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;touch-action:manipulation;text-align:center}
.switch-program{border:1.5px solid var(--orange);background:#FFF4E6;color:var(--deep)}
.activate-day{border:1.5px solid #B7BDB4;background:#EEF0EA;color:#667061}
.panel.on-history .done-toggle,.panel.on-history .done-time,.panel.on-history .load,.panel.on-history .load-view{display:none!important}
.panel.on-history .day-note{display:none}
.day-note-view{display:none;width:100%;min-height:4.6rem;padding:10px 12px;border:1.5px solid #B7BDB4;border-radius:12px;background:#EEF0EA;color:#667061;font:inherit;font-size:15px;font-weight:500;white-space:pre-wrap;word-break:break-word}
.panel.on-history .day-note-view{display:block}
.mode-confirm{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:1rem;background:#181F1740}
.mode-confirm[hidden]{display:none}
.mode-confirm-card{width:min(20rem,100%);padding:1rem 1rem .9rem;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 10px 28px #22301C24;text-align:center}
.mode-confirm-card p{margin:0 0 .9rem;color:var(--ink);font-size:15px;font-weight:600;line-height:1.35}
.mode-confirm-actions{display:flex;gap:8px;justify-content:center}
.mode-confirm-actions button{min-height:40px;min-width:5.5rem;padding:0 12px;border-radius:10px;font:750 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
.mode-confirm-cancel{border:1.5px solid var(--line);background:#fff;color:var(--muted)}
.mode-confirm-ok{border:0;background:var(--green);color:#F2F2F2}
.celebrate{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.celebrate[hidden]{display:none}
.celebrate-piece{position:absolute;top:-12px;border-radius:2px;opacity:1;will-change:transform,opacity;animation:celebrate-fall linear forwards}
@keyframes celebrate-fall{
  0%{transform:translate3d(0,0,0) rotate(0deg);opacity:1}
  80%{opacity:1}
  100%{transform:translate3d(var(--drift,0),110vh,0) rotate(720deg);opacity:0}
}
@media(prefers-reduced-motion:reduce){.celebrate,.celebrate-piece{display:none!important;animation:none!important}}
@media(max-width:420px){.day-head{gap:8px}.switch-program,.activate-day{padding:5px 8px;font-size:11px}.day-head-slot{min-width:4.8rem}}
.panel.on-history .prescription{grid-template-columns:minmax(0,1fr)}
.active-on-value{display:flex;align-items:center;justify-content:center;gap:5px}
.active-on-clear{width:18px;height:18px;margin:0;border:1.5px solid currentColor;border-radius:50%;background:#fff;color:#b42318;font-size:15px}
</style>
</head>
<body data-storage-key="{{STORAGE_KEY}}">
<header class="hero"><div class="inner hero-top"><div class="hero-copy"><h1>{{H1_HTML}}</h1><p class="brand">MemtoFit</p><p class="period">{{PERIOD}}</p><div class="progress"><p class="week-dots" data-start="{{START_DATE}}" data-weeks="{{WEEK_TOTAL}}" role="img" hidden></p><p class="week-count" hidden></p></div><p class="goal">{{GOAL}}</p></div>
<!-- Trainer photos: absolute https URL, square WebP or JPEG, 256×256 up to 512×512. The frame is half the green header height, capped at 512×512. Unassigned image is profile-not-trainer.svg. Chat link is a WhatsApp or Telegram https URL. -->
<section class="trainer" aria-label="Trainer" data-name="" data-photo="" data-portfolio="" data-chat="">
  <div class="trainer-card trainer-empty">
    <img class="trainer-photo" src="profile-not-trainer.svg" alt="" decoding="async">
    <p class="trainer-status">No trainer assigned to you yet</p>
  </div>
  <div class="trainer-card trainer-set" hidden>
    <img class="trainer-photo trainer-face" alt="" decoding="async" hidden>
    <p class="trainer-name"><span class="trainer-who"></span><a class="trainer-chat" href="#" aria-label="Group chat"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="9" r="1.7" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M3.2 18.2c.5-2.7 2.5-4.2 4.8-4.2s4.3 1.5 4.8 4.2M13.2 18.2c.3-1.8 1.6-3 3.1-3 1.3 0 2.4.8 2.9 2.2"/></svg></a></p>
    <p class="trainer-role"><span>your personal trainer</span><a class="info on-dark trainer-portfolio" href="#" aria-label="View trainer portfolio"><span aria-hidden="true">i</span></a></p>
  </div>
</section>
</div></header>
<nav class="sticky" aria-label="Choose week and workout">
  <div class="nav weeks" role="tablist" aria-label="Training week">
    {{WEEK_BUTTONS}}
  </div>
  <div class="nav days" role="tablist" aria-label="Workout day">
    {{DAY_BUTTONS}}
  </div>
</nav>
<main class="main">
  {{PANELS}}
</main>
<footer class="site-foot"><p>Issued on <time datetime="{{ISSUED_ON}}">{{ISSUED_DATE}}</time> · © 2026 memtoria.com</p></footer>
<script>
(()=>{
  const nav = document.querySelector(".sticky");
  const weekBar = document.querySelector(".weeks");
  const weekTabs = [...document.querySelectorAll(".weeks [data-week]")];
  const dayTabs = [...document.querySelectorAll(".days [data-day]")];
  const bonusTab = document.querySelector(".days [data-bonus]");
  const bonusPanel = document.querySelector(".bonus-panel");
  const panels = [...document.querySelectorAll(".panel")].filter((p) => !p.classList.contains("bonus-panel"));
  const weekPanels = [...document.querySelectorAll('[id^="week-panel-"]')];
  let week = 0, day = 0, bonus = false;
  const dayCount = dayTabs.length || 1;
  if (weekTabs.length < 2 && weekBar) weekBar.hidden = true;

  function bringPlanIntoView() {
    const distance = Math.max(0, nav.getBoundingClientRect().top);
    if (distance > 0) window.scrollBy({ top: distance, behavior: "smooth" });
  }
  function clampIndex(value, length) {
    const n = Number(value);
    if (!length || !Number.isFinite(n) || n < 0) return 0;
    if (n >= length) return length - 1;
    return n;
  }
  function update() {
    weekTabs.forEach((b, i) => {
      b.setAttribute("aria-selected", String(i === week));
      b.tabIndex = i === week ? 0 : -1;
    });
    weekPanels.forEach((p, i) => { p.hidden = i !== week; });
    dayTabs.forEach((b, i) => {
      const on = !bonus && i === day;
      b.setAttribute("aria-selected", String(on));
      b.tabIndex = on ? 0 : -1;
    });
    if (bonusTab) {
      bonusTab.setAttribute("aria-selected", String(bonus));
      bonusTab.tabIndex = bonus ? 0 : -1;
    }
    panels.forEach((p, i) => { p.hidden = bonus || i !== week * dayCount + day; });
    if (bonusPanel) bonusPanel.hidden = !bonus;
  }
  function showBonus(report) {
    bonus = true;
    update();
    if (report) tell({ type: "memtofit-place", week: week, day: day });
  }
  function calendarWeek(startISO) {
    const parts = startISO.split("-");
    if (parts.length !== 3) return 0;
    const start = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    const today = new Date();
    const startMid = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    if (todayMid < startMid) return 0;
    const days = Math.round((todayMid - startMid) / 86400000);
    return Math.floor(days / 7) + 1;
  }
  function paintDots() {
    const el = document.querySelector(".week-dots");
    if (!el) return;
    const total = parseInt(el.dataset.weeks, 10);
    const start = el.dataset.start || "";
    const count = document.querySelector(".week-count");
    if (!total || total < 1 || !/^\d{4}-\d{2}-\d{2}$/.test(start)) {
      el.hidden = true;
      el.replaceChildren();
      el.removeAttribute("aria-label");
      if (count) count.hidden = true;
      return;
    }
    const current = calendarWeek(start);
    const filled = Math.max(0, Math.min(total, current));
    const label = current < 1 ? "Before week 1 of " + total : "Week " + filled + " of " + total;
    el.replaceChildren();
    for (let i = 0; i < total; i++) {
      const dot = document.createElement("span");
      dot.setAttribute("aria-hidden", "true");
      if (i < filled) dot.className = "on";
      el.appendChild(dot);
    }
    el.setAttribute("aria-label", label);
    el.hidden = false;
    if (count) {
      count.textContent = label;
      count.hidden = false;
    }
  }
  function applyPlace(nextWeek, nextDay, report) {
    bonus = false;
    week = clampIndex(nextWeek, weekTabs.length || 1);
    day = clampIndex(nextDay, dayTabs.length || 1);
    update();
    if (report) tell({ type: "memtofit-place", week: week, day: day });
  }

  const storageKey = document.body.dataset.storageKey;
  let saved = {};
  let unitLabel = "lb";
  let active = null;
  const ACTIVE_HOURS = 11;
  try { saved = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch (err) {}

  function panelId(panel) {
    return panel && panel.dataset ? panel.dataset.panel : "";
  }
  function parsePanelId(id) {
    const parts = String(id || "").split("-");
    if (parts.length !== 2) return null;
    const w = Number(parts[0]);
    const d = Number(parts[1]);
    if (!Number.isFinite(w) || !Number.isFinite(d)) return null;
    return { week: w, day: d };
  }
  function nextPanelId(id) {
    const place = parsePanelId(id);
    if (!place) return id;
    let w = place.week;
    let d = place.day + 1;
    if (d >= dayCount) {
      w += 1;
      d = 0;
    }
    if (w >= (weekTabs.length || 1)) {
      w = Math.max(0, (weekTabs.length || 1) - 1);
      d = Math.max(0, dayCount - 1);
    }
    return w + "-" + d;
  }
  function formatActiveDate(iso) {
    const when = new Date(iso);
    if (isNaN(when.getTime())) return "";
    const pad = (n) => String(n).padStart(2, "0");
    return when.getFullYear() + "/" + pad(when.getMonth() + 1) + "/" + pad(when.getDate());
  }
  function normalizeActive(raw) {
    if (!raw || typeof raw !== "object") return null;
    if (raw.idle) return { idle: true };
    const id = String(raw.panel || "");
    if (!parsePanelId(id) || !panels.some((p) => panelId(p) === id)) return null;
    const pending = !!raw.pending;
    const at = raw.at ? String(raw.at) : null;
    if (!pending && !at) return null;
    return { panel: id, at: pending ? null : at, pending: pending };
  }
  function activeStorageKey() {
    return storageKey + "-active";
  }
  function readLocalActive() {
    try { return normalizeActive(JSON.parse(localStorage.getItem(activeStorageKey()) || "null")); }
    catch (err) { return null; }

        link.rel = "noopener noreferrer";
      } else {
        link.removeAttribute("target");
        link.removeAttribute("rel");
      }
    });
    if (trainerChatLink) {
      trainerChatLink.href = chat || "#";
      if (chat) {
        trainerChatLink.target = "_blank";
        trainerChatLink.rel = "noopener noreferrer";
      } else {
        trainerChatLink.removeAttribute("target");
        trainerChatLink.removeAttribute("rel");
      }
    }
    if (!name) {
      trainerEmpty.hidden = false;
      trainerSet.hidden = true;
      return;
    }
    trainerEmpty.hidden = true;
    trainerSet.hidden = false;
    if (trainerWho) trainerWho.textContent = name;
    if (trainerChatLink) trainerChatLink.setAttribute("aria-label", "Chat with " + name);
    const about = trainerSet.querySelector(".trainer-portfolio");
    if (about) about.setAttribute("aria-label", "About " + name);
    if (!trainerFace) return;
    function useFace(src, check) {
      trainerFace.onload = () => {
        if (!check) return;
        const wide = trainerFace.naturalWidth;
        const high = trainerFace.naturalHeight;
        const square = wide === high;
        const sized = wide >= PHOTO_EDGE && wide <= PHOTO_MAX && high >= PHOTO_EDGE && high <= PHOTO_MAX;
        if (!square || !sized) useFace("profile-not-trainer.svg", false);
      };
      trainerFace.onerror = () => {
        if (check) useFace("profile-not-trainer.svg", false);
      };
      trainerFace.hidden = false;
      trainerFace.src = src;
    }
    useFace(photo || "profile-not-trainer.svg", Boolean(photo));
    sizeTrainerPhoto();
  }

  function sizeTrainerPhoto() {
    const hero = document.querySelector(".hero");
    if (!hero) return;
    const photos = document.querySelectorAll(".trainer-photo");
    if (!photos.length) return;
    let side = 0;
    for (let pass = 0; pass < 4; pass++) {
      const next = Math.round(Math.min(512, hero.getBoundingClientRect().height * 0.5));
      if (next < 1 || next === side) break;
      side = next;
      photos.forEach((img) => {
        img.style.width = side + "px";
        img.style.height = side + "px";
      });
    }
  }

  document.addEventListener("click", (e) => {
    const port = e.target.closest && e.target.closest(".trainer-portfolio");
    if (port && !trainerPortfolio()) e.preventDefault();
    const chat = e.target.closest && e.target.closest(".trainer-chat");
    if (chat && !trainerChat()) e.preventDefault();
  });
  paintTrainer();

  paintDots();
  update();
  sizeTrainerPhoto();
  window.addEventListener("resize", sizeTrainerPhoto);
})();
</script>
</body>
</html>
