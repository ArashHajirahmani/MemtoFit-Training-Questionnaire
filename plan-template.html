<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C4A27">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<style>
:root{--green:#2C4A27;--deep:#181F17;--amber:#FAAF58;--orange:#F99E34;--paper:#F7F6F1;--ink:#20251E;--muted:#667061;--line:#E5E7DF;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{background:var(--paper);-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.hero{padding:calc(22px + env(safe-area-inset-top,0px)) 20px 23px;background:var(--green);color:#F2F2F2}.inner,.nav,.main{max-width:650px;margin-inline:auto}.brand{margin:4px 0 0;color:var(--amber);font-size:13px;font-weight:600;letter-spacing:0}h1{margin:0;font-size:clamp(30px,8vw,40px);line-height:1.05;letter-spacing:-.04em}.period{margin:8px 0 0;color:#f2f2f2d0;font-size:14px}.goal{display:inline-block;margin:15px 0 0;padding:6px 10px;border:1px solid #FAAF5870;border-radius:99px;color:var(--amber);font-size:12px;font-weight:700}.sticky{position:sticky;top:0;z-index:4;padding:10px max(12px,calc((100vw - 650px)/2));border-bottom:1px solid var(--line);background:#F7F6F1EE;backdrop-filter:blur(12px)}.nav{display:flex;gap:7px}.weeks{padding:4px;border-radius:13px;background:#E9ECE5}.nav button{flex:1;min-width:0;min-height:44px;padding:0 7px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font:inherit;font-weight:750;cursor:pointer;touch-action:manipulation}.weeks button{border:0;background:transparent}.weeks [aria-selected="true"]{background:var(--green);color:#fff}.days{margin-top:8px}.days button{font-size:13px}.days [aria-selected="true"]{border-color:var(--orange);background:#FFF4E6;color:var(--deep)}.days small{display:block;font-size:10px;line-height:1.1;opacity:.72}.main{padding:18px 14px calc(34px + var(--safe))}.panel[hidden],[role="tabpanel"][hidden]{display:none}.eyebrow{margin:0 2px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.09em}.panel h2{margin:2px;font-size:26px;letter-spacing:-.03em}.focus{margin:4px 2px 12px;color:var(--muted);font-size:12px}.table-wrap{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 4px 18px #22301C0B}table{width:100%;border-collapse:collapse;text-align:left}thead{background:#F1F3ED}thead th{padding:11px 14px;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}thead th:last-child{text-align:right}tbody th,tbody td{padding:14px;border-top:1px solid var(--line);vertical-align:middle}tbody th{font-size:15px;font-weight:750}tbody td{width:34%;color:var(--green);font-size:14px;font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}tbody tr:first-child th,tbody tr:first-child td{border-top:0}.exercise{display:flex;align-items:center;flex-wrap:wrap;gap:6px;line-height:1.4}a{color:inherit;text-decoration-color:var(--orange);text-decoration-thickness:2px;text-underline-offset:3px}.join{display:inline-flex;align-items:center;min-height:22px;padding:1px 7px;border-radius:99px;background:#FFF0DD;color:#754314;font-size:9px;letter-spacing:.07em}.hint{display:block;margin-top:5px;color:var(--muted);font-size:11px;font-weight:650}.prescription{display:grid;grid-template-columns:minmax(0,1fr) 30px;align-items:center;justify-items:end;column-gap:6px;row-gap:1px}.done-toggle{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:0 0 30px;cursor:pointer}.done-box{appearance:none;display:grid;place-items:center;width:22px;height:22px;margin:0;border:1.5px solid #91A58A;border-radius:6px;background:#fff;cursor:pointer}.done-box:checked{border-color:#9BBE91;background:#DDEDD7}.done-box:checked:after{content:"";width:6px;height:11px;margin-top:-3px;border:solid var(--green);border-width:0 2px 2px 0;transform:rotate(45deg)}.done-time{display:block;width:30px;margin:0;color:#547C4B;font-size:10px;font-weight:650;line-height:1;text-align:center;font-variant-numeric:tabular-nums}.done-time[hidden]{display:none}.pair{background:#FFFAF3}.pair th{border-left:3px solid var(--orange);padding-left:11px}.pair td{background:#FFFAF3}.legend{padding:18px 4px 0;color:var(--muted);font-size:11px;text-align:center}.legend b{color:var(--green)}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}@media(max-width:420px){.sticky{padding-inline:9px}.main{padding:14px 10px calc(28px + var(--safe))}.days button{font-size:12px}.panel h2{font-size:24px}tbody th,tbody td{padding:13px 10px}tbody th{font-size:14px}tbody td{font-size:13px;width:auto}.prescription{column-gap:4px}.set-value{white-space:normal}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}@media print{.sticky{position:static}.panel[hidden]{display:block!important;break-before:page}.main{max-width:none}.table-wrap{break-inside:avoid}}
.weeks[hidden]{display:none}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.load{display:block;width:3.6rem;height:20px;min-height:0;margin:0;padding:0 3px;border:1px solid var(--orange);border-radius:6px;background:#fff;color:var(--ink);font:700 11px/18px system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
.load[hidden]{display:none}
.load::placeholder{color:#8A9484;font-weight:650}
h2.noted{display:flex;align-items:center;gap:8px}
.info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:0 0 18px;margin:0;padding:0;border:1.5px solid var(--orange);border-radius:50%;background:#fff;color:var(--deep);font:700 11px/1 Georgia,"Times New Roman",serif;cursor:pointer;vertical-align:middle}
h1 .info{margin-left:8px;position:relative;top:-6px}
.info.on-dark{border-color:var(--amber);background:transparent;color:var(--amber)}
.note-src{display:none}
.note-pop{position:fixed;z-index:30;max-width:min(22rem,calc(100vw - 20px));max-height:min(60vh,28rem);overflow:auto;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:14px;font-weight:500;line-height:1.45;white-space:pre-wrap;box-shadow:0 10px 28px #22301C24}
.day-note-wrap{margin:14px 2px 0}
.day-note-wrap span{display:block;margin:0 0 4px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.day-note{width:100%;min-height:4.6rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:15px;font-weight:500;resize:vertical}
@media(max-width:420px){.load{width:3.2rem}}
</style>
</head>
<body data-storage-key="{{STORAGE_KEY}}">
<header class="hero"><div class="inner"><h1>{{H1_HTML}}</h1><p class="brand">MemtoFit</p><p class="period">{{PERIOD}}</p><p class="goal">{{GOAL}}</p></div></header>
<nav class="sticky" aria-label="Choose week and workout">
  <div class="nav weeks" role="tablist" aria-label="Training week">
    {{WEEK_BUTTONS}}
  </div>
  <div class="nav days" role="tablist" aria-label="Workout day">
    {{DAY_BUTTONS}}
  </div>
</nav>
<main class="main">
  {{PANELS}}
  <p class="legend"><b>OR</b> choose one · <b>AND</b> do both as a superset · Start here means first · Always last means finish there.</p>
</main>
<script>
(()=>{
  const nav = document.querySelector(".sticky");
  const weekBar = document.querySelector(".weeks");
  const weekTabs = [...document.querySelectorAll("[data-week]")];
  const dayTabs = [...document.querySelectorAll("[data-day]")];
  const panels = [...document.querySelectorAll(".panel")];
  const weekPanels = [...document.querySelectorAll('[id^="week-panel-"]')];
  let week = 0, day = 0;
  const dayCount = dayTabs.length || 1;
  if (weekTabs.length < 2 && weekBar) weekBar.hidden = true;

  function bringPlanIntoView() {
    const distance = Math.max(0, nav.getBoundingClientRect().top);
    if (distance > 0) window.scrollBy({ top: distance, behavior: "smooth" });
  }
  function update() {
    weekTabs.forEach((b, i) => {
      b.setAttribute("aria-selected", String(i === week));
      b.tabIndex = i === week ? 0 : -1;
    });
    weekPanels.forEach((p, i) => { p.hidden = i !== week; });
    dayTabs.forEach((b, i) => {
      b.setAttribute("aria-selected", String(i === day));
      b.tabIndex = i === day ? 0 : -1;
    });
    panels.forEach((p, i) => { p.hidden = i !== week * dayCount + day; });
  }

  const storageKey = document.body.dataset.storageKey;
  let saved = {};
  let unitLabel = "lb";
  try { saved = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch (err) {}

  function numeric(raw) {
    const cleaned = String(raw || "").replace(",", ".").replace(/[^\d.]/g, "");
    const dot = cleaned.indexOf(".");
    if (dot === -1) return cleaned.slice(0, 6);
    return (cleaned.slice(0, dot) + "." + cleaned.slice(dot + 1).replace(/\./g, "")).slice(0, 6);
  }

  function rowLabel(row) {
    const ex = row.querySelector(".exercise");
    if (!ex) return "exercise";
    const clone = ex.cloneNode(true);
    clone.querySelectorAll(".info, .note-src").forEach((n) => n.remove());
    return clone.textContent.replace(/\s+/g, " ").trim();
  }

  function tell(msg) {
    if (window.parent && window.parent !== window) window.parent.postMessage(msg, "*");
  }

  document.querySelectorAll(".panel").forEach((panel) => {
    panel.querySelectorAll("tbody tr").forEach((row, index) => {
      const cell = row.querySelector("td.sets");
      const load = row.querySelector(".load");
      if (!cell) return;
      const key = panel.dataset.panel + "-" + index;
      const label = rowLabel(row);
      const value = cell.textContent.trim();
      const wrap = document.createElement("div");
      const text = document.createElement("span");
      const toggle = document.createElement("label");
      const check = document.createElement("input");
      const time = document.createElement("small");
      wrap.className = "prescription";
      text.className = "set-value";
      text.textContent = value;
      toggle.className = "done-toggle";
      check.className = "done-box";
      check.type = "checkbox";
      check.id = "done-" + key;
      check.setAttribute("aria-label", "Mark " + label + " — " + value + " complete");
      toggle.htmlFor = check.id;
      toggle.append(check);
      wrap.append(text, toggle);
      time.className = "done-time";
      time.hidden = true;
      time.setAttribute("aria-live", "polite");
      const record = saved[key];
      if (record && record.done) {
        check.checked = true;
        time.textContent = record.time;
        time.hidden = false;
      }
      if (load) {
        load.hidden = !check.checked;
        wrap.append(load);
      }
      wrap.append(time);
      cell.replaceChildren(wrap);
      function showLog(focus) {
        if (!load) return;
        load.hidden = false;
        load.value = "";
        load.placeholder = load.dataset.last || unitLabel;
        if (focus) load.focus();
      }
      check.addEventListener("change", () => {
        if (check.checked) {
          const now = new Date();
          const stamp = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
          saved[key] = { done: true, time: stamp };
          time.textContent = stamp;
          time.hidden = false;
          showLog(true);
        } else {
          delete saved[key];
          time.textContent = "";
          time.hidden = true;
          if (load) load.hidden = true;
        }
        try { localStorage.setItem(storageKey, JSON.stringify(saved)); } catch (err) {}
      });
      if (load) {
        load.addEventListener("input", () => {
          const next = numeric(load.value);
          if (next !== load.value) load.value = next;
        });
        load.addEventListener("change", () => {
          const v = numeric(load.value).replace(/\.$/, "");
          load.value = v;
          if (!v) {
            load.placeholder = load.dataset.last || unitLabel;
            return;
          }
          load.dataset.last = v;
          tell({ type: "memtofit-save-load", key: load.dataset.key, value: v });
        });
      }
    });
    const note = panel.querySelector(".day-note");
    if (note) {
      note.addEventListener("change", () => {
        tell({ type: "memtofit-save-day", key: note.dataset.day, value: note.value.trim() });
      });
    }
  });

  const pop = document.createElement("div");
  pop.className = "note-pop";
  pop.setAttribute("role", "dialog");
  pop.tabIndex = -1;
  pop.hidden = true;
  document.body.appendChild(pop);
  let openBtn = null;
  function closePop() {
    pop.hidden = true;
    if (openBtn) openBtn.setAttribute("aria-expanded", "false");
    openBtn = null;
  }
  function openPop(btn) {
    const src = btn.parentElement && btn.parentElement.querySelector(".note-src");
    if (!src || !src.textContent.trim()) return;
    if (openBtn === btn) { closePop(); return; }
    closePop();
    pop.textContent = src.textContent.trim();
    pop.hidden = false;
    openBtn = btn;
    btn.setAttribute("aria-expanded", "true");
    const rect = btn.getBoundingClientRect();
    const width = pop.offsetWidth;
    const height = pop.offsetHeight;
    let left = Math.max(10, Math.min(rect.left, window.innerWidth - width - 10));
    let top = rect.bottom + 8;
    if (top + height > window.innerHeight - 10) top = Math.max(10, rect.top - height - 8);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }
  document.addEventListener("click", (e) => {
    const btn = e.target.closest && e.target.closest(".info");
    if (btn) { e.preventDefault(); e.stopPropagation(); openPop(btn); return; }
    if (!pop.hidden && !pop.contains(e.target)) closePop();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePop(); });
  window.addEventListener("scroll", (e) => { if (e.target !== pop) closePop(); }, true);

  function applyUnit(unit) {
    unitLabel = unit === "kg" ? "kg" : "lb";
    document.querySelectorAll(".load").forEach((input) => {
      if (!input.dataset.last) input.placeholder = unitLabel;
    });
  }
  applyUnit("lb");
  window.addEventListener("message", (e) => {
    if (e.source !== window.parent) return;
    const msg = e.data || {};
    if (msg.type !== "memtofit-hydrate" || !msg.data) return;
    applyUnit(msg.data.unit);
    const loads = msg.data.loads || {};
    document.querySelectorAll(".load").forEach((input) => {
      const rec = loads[input.dataset.key];
      const last = rec && rec.v ? numeric(rec.v).replace(/\.$/, "") : "";
      if (last) input.dataset.last = last;
      else delete input.dataset.last;
      input.value = "";
      input.placeholder = last || unitLabel;
      const check = input.closest("tr") && input.closest("tr").querySelector(".done-box");
      input.hidden = !(check && check.checked);
    });
    const days = msg.data.days || {};
    document.querySelectorAll(".day-note").forEach((note) => {
      const rec = days[note.dataset.day];
      note.value = rec && rec.v ? rec.v : "";
    });
  });
  tell({ type: "memtofit-ready" });

  weekTabs.forEach((b, i) => b.addEventListener("click", () => { week = i; bringPlanIntoView(); update(); }));
  dayTabs.forEach((b, i) => b.addEventListener("click", () => { day = i; bringPlanIntoView(); update(); }));
  for (const group of [weekTabs, dayTabs]) {
    group.forEach((b, i) => b.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      e.preventDefault();
      const n = (i + (e.key === "ArrowRight" ? 1 : group.length - 1)) % group.length;
      group[n].focus();
      group[n].click();
    }));
  }
  update();
})();
</script>
</body>
</html>
