<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C4A27">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<style>
:root{--green:#2C4A27;--deep:#181F17;--amber:#FAAF58;--orange:#F99E34;--paper:#F7F6F1;--ink:#20251E;--muted:#667061;--line:#E5E7DF;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{background:var(--paper);-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.hero{padding:calc(22px + env(safe-area-inset-top,0px)) 20px 23px;background:var(--green);color:#F2F2F2}.inner,.nav,.main{max-width:650px;margin-inline:auto}.brand{margin:4px 0 0;color:var(--amber);font-size:13px;font-weight:600;letter-spacing:0}h1{margin:0;font-size:clamp(30px,8vw,40px);line-height:1.05;letter-spacing:-.04em}.period{margin:8px 0 0;color:#f2f2f2d0;font-size:14px}.goal{display:inline-block;margin:15px 0 0;padding:6px 10px;border:1px solid #FAAF5870;border-radius:99px;color:var(--amber);font-size:12px;font-weight:700}.sticky{position:sticky;top:0;z-index:4;padding:10px max(12px,calc((100vw - 650px)/2));border-bottom:1px solid var(--line);background:#F7F6F1EE;backdrop-filter:blur(12px)}.nav{display:flex;gap:7px}.weeks{padding:4px;border-radius:13px;background:#E9ECE5}.nav button{flex:1;min-width:0;min-height:44px;padding:0 7px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font:inherit;font-weight:750;cursor:pointer;touch-action:manipulation}.weeks button{border:0;background:transparent}.weeks [aria-selected="true"]{background:var(--green);color:#fff}.days{margin-top:8px}.days button{font-size:13px}.days [aria-selected="true"]{border-color:var(--orange);background:#FFF4E6;color:var(--deep)}.days small{display:block;font-size:10px;line-height:1.1;opacity:.72}.main{padding:18px 14px calc(34px + var(--safe))}.panel[hidden],[role="tabpanel"][hidden]{display:none}.eyebrow{margin:0 2px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.09em}.panel h2{margin:2px;font-size:26px;letter-spacing:-.03em}.focus{margin:4px 2px 12px;color:var(--muted);font-size:12px}.table-wrap{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 4px 18px #22301C0B}table{width:100%;border-collapse:collapse;text-align:left}thead{background:#F1F3ED}thead th{padding:11px 14px;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}thead th:last-child{text-align:right}tbody th,tbody td{padding:14px;border-top:1px solid var(--line);vertical-align:middle}tbody th{font-size:15px;font-weight:750}tbody td{width:34%;color:var(--green);font-size:14px;font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}tbody tr:first-child th,tbody tr:first-child td{border-top:0}.exercise{display:flex;align-items:center;flex-wrap:wrap;gap:6px;line-height:1.4}a{color:inherit;text-decoration-color:var(--orange);text-decoration-thickness:2px;text-underline-offset:3px}.join{display:inline-flex;align-items:center;min-height:22px;padding:1px 7px;border-radius:99px;background:#FFF0DD;color:#754314;font-size:9px;letter-spacing:.07em}.hint{display:block;margin-top:5px;color:var(--muted);font-size:11px;font-weight:650}.prescription{display:flex;align-items:center;justify-content:flex-end;gap:8px}.done-toggle{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:0 0 30px;cursor:pointer}.done-box{appearance:none;display:grid;place-items:center;width:22px;height:22px;margin:0;border:1.5px solid #91A58A;border-radius:6px;background:#fff;cursor:pointer}.done-box:checked{border-color:#9BBE91;background:#DDEDD7}.done-box:checked:after{content:"";width:6px;height:11px;margin-top:-3px;border:solid var(--green);border-width:0 2px 2px 0;transform:rotate(45deg)}.done-time{display:block;margin-top:2px;color:#547C4B;font-size:10px;font-weight:650;font-variant-numeric:tabular-nums}.done-time[hidden]{display:none}.pair{background:#FFFAF3}.pair th{border-left:3px solid var(--orange);padding-left:11px}.pair td{background:#FFFAF3}.legend{padding:18px 4px 0;color:var(--muted);font-size:11px;text-align:center}.legend b{color:var(--green)}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}@media(max-width:420px){.sticky{padding-inline:9px}.main{padding:14px 10px calc(28px + var(--safe))}.days button{font-size:12px}.panel h2{font-size:24px}tbody th,tbody td{padding:13px 10px}tbody th{font-size:14px}tbody td{font-size:13px;width:auto}.prescription{flex-wrap:wrap;gap:4px}.set-value{white-space:normal}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}@media print{.sticky{position:static}.panel[hidden]{display:block!important;break-before:page}.main{max-width:none}.table-wrap{break-inside:avoid}}
</style>
</head>
<body data-storage-key="{{STORAGE_KEY}}">
<header class="hero"><div class="inner"><h1>{{H1}}</h1><p class="brand">MemtoFit</p><p class="period">{{PERIOD}}</p><p class="goal">{{GOAL}}</p></div></header>
<nav class="sticky" aria-label="Choose week and workout">
  <div class="nav weeks" role="tablist" aria-label="Training week">
    {{WEEK_BUTTONS}}
  </div>
  <div class="nav days" role="tablist" aria-label="Workout day">
    {{DAY_BUTTONS}}
  </div>
</nav>
<main class="main">
  {{PANELS}}
  <p class="legend"><b>OR</b> choose one · <b>AND</b> do both as a superset · Start here means first · Always last means finish there.</p>
</main>
<script>
(()=>{const nav=document.querySelector(".sticky"),weekTabs=[...document.querySelectorAll("[data-week]")],dayTabs=[...document.querySelectorAll("[data-day]")],panels=[...document.querySelectorAll(".panel")],weekPanels=[...document.querySelectorAll('[id^="week-panel-"]')];let week=0,day=0;const dayCount=dayTabs.length;function bringPlanIntoView(){const distance=Math.max(0,nav.getBoundingClientRect().top);if(distance>0)window.scrollBy({top:distance,behavior:"smooth"})}function update(){weekTabs.forEach((b,i)=>{b.setAttribute("aria-selected",String(i===week));b.tabIndex=i===week?0:-1});weekPanels.forEach((p,i)=>p.hidden=i!==week);dayTabs.forEach((b,i)=>{b.setAttribute("aria-selected",String(i===day));b.tabIndex=i===day?0:-1});panels.forEach((p,i)=>p.hidden=i!==week*dayCount+day)}const storageKey=document.body.dataset.storageKey;let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||"{}")}catch{}document.querySelectorAll(".panel").forEach(panel=>panel.querySelectorAll("tbody tr").forEach((row,index)=>{const cell=row.querySelector("td"),key=panel.dataset.panel+"-"+index,label=row.querySelector(".exercise").textContent.replace(/\s+/g," ").trim(),value=cell.textContent.trim(),wrap=document.createElement("div"),text=document.createElement("span"),toggle=document.createElement("label"),check=document.createElement("input"),time=document.createElement("small");wrap.className="prescription";text.className="set-value";text.textContent=value;toggle.className="done-toggle";check.className="done-box";check.type="checkbox";check.id="done-"+key;check.setAttribute("aria-label","Mark "+label+" — "+value+" complete");toggle.htmlFor=check.id;toggle.append(check);wrap.append(text,toggle);time.className="done-time";time.hidden=true;time.setAttribute("aria-live","polite");const record=saved[key];if(record&&record.done){check.checked=true;time.textContent=record.time;time.hidden=false}cell.replaceChildren(wrap,time);check.addEventListener("change",()=>{if(check.checked){const now=new Date(),stamp=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");saved[key]={done:true,time:stamp};time.textContent=stamp;time.hidden=false}else{delete saved[key];time.textContent="";time.hidden=true}try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch{}})}));weekTabs.forEach((b,i)=>b.addEventListener("click",()=>{week=i;bringPlanIntoView();update()}));dayTabs.forEach((b,i)=>b.addEventListener("click",()=>{day=i;bringPlanIntoView();update()}));for(const group of [weekTabs,dayTabs])group.forEach((b,i)=>b.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();const n=(i+(e.key==="ArrowRight"?1:group.length-1))%group.length;group[n].focus();group[n].click()}}));update()})();
</script>
</body>
</html>
